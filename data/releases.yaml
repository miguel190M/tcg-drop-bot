# Manual release list. This file always wins over auto-discovered data.
# Add/edit entries here; the bot re-scores and re-syncs the calendar on every run.
#
# Fields
#   id            unique slug
#   game          pokemon | onepiece
#   name, code    set name / set code
#   set_type      main | special | extra | premium | anniversary
#   en_release    English street date (YYYY-MM-DD). AU retail is usually same day.
#   jp_release    Japanese date (leading indicator)
#   preorder_open date preorders open at AU game stores (optional)
#   confirmed     false = tentative date
#   chase         headline characters on the chase cards (drives the score)
#   reprint_risk  low | medium | high
#   au_rrp        AUD RRP per product (optional, needed for premium + margin calcs)
#   ebay_query    eBay search used for preorder/aftermarket price (optional)
#   jp_box_rrp_jpy / jp_box_market_jpy   JP booster box RRP vs current market (optional)
#   offers        overseas listings to run landed-cost checks on (optional)

